name: Import 28LOTS media

on:
  push:
    paths:
      - 'media_transfer_v2/ready.txt'

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild media archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media
          base64 -d media_transfer_v2/archive.b64 > /tmp/28lots-media.tar.gz
          tar -xzf /tmp/28lots-media.tar.gz -C media
          test "$(find media/webp -type f -name '*.webp' | wc -l)" -eq 34
          find media -type f | sort
      - name: Commit media library
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media
          if git diff --cached --quiet; then
            echo "No media changes to commit"
            exit 0
          fi
          git commit -m "Add 28LOTS media library"
          git push
